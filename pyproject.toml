[tool.poetry]
name = "grafana-dashboards"
version = "0.1.0"
description = ""
authors = ["AnamariaZvonaru", "bobokrut <egor-evlampiev@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
certifi = {version = "2023.7.22", python = "3.11", platform = "linux"}
charset-normalizer = {version = "3.3.0", python = "3.11", platform = "linux"}
idna = {version = "3.4", python = "3.11", platform = "linux"}
pyyaml = {version = "6.0.1", python = "3.11", platform = "linux"}
requests = {version = "2.31.0", python = "3.11", platform = "linux"}
urllib3 = {version = "2.0.7", python = "3.11", platform = "linux"}


[tool.poetry.group.dev.dependencies]
black = "^23.10.0"
pytest = "^7.4.2"
debugpy = "^1.8.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py311"]


[tool.ruff]
select = ["E", "F", "T20"]
ignore = ["E402", "E501"]
