[tool.poetry]
name = "grafana-dashboards"
version = "0.1.0"
description = ""
authors = ["AnamariaZvonaru", "bobokrut <egor-evlampiev@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pyyaml = "^6.0.1"
requests = "^2.31.0"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
jinja2 = "^3.1.2"


[tool.poetry.group.dev.dependencies]
black = "^23.10.0"
pytest = "^7.4.2"
debugpy = "^1.8.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py311"]


[tool.ruff]
select = ["E", "F", "T20"]
ignore = ["E402", "E501"]
